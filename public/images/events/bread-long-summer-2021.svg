<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Long Bread Summer fundraiser card</title>
  <desc id="desc">Summer-themed fundraiser visual with lineup and cause information for July 10 stream.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1598F1"/>
      <stop offset="65%" stop-color="#68CFF7"/>
      <stop offset="100%" stop-color="#9BE7F4"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#sky)"/>
  <ellipse cx="190" cy="1030" rx="390" ry="210" fill="#B06A3A" opacity="0.8"/>
  <ellipse cx="910" cy="1160" rx="330" ry="170" fill="#C98C54" opacity="0.55"/>

  <text x="76" y="152" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700">JULY 10 / FUNDRAISER STREAM</text>
  <text x="76" y="330" fill="#F7FEFF" font-family="Arial Black, Arial, sans-serif" font-size="188">LONG</text>
  <text x="76" y="455" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-size="150">bread</text>
  <text x="76" y="590" fill="#F7FEFF" font-family="Arial Black, Arial, sans-serif" font-size="188">SUMMER</text>

  <rect x="76" y="640" width="928" height="2" fill="#E8FDFF"/>
  <text x="76" y="730" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">ANÓNIMA • BAHAR KHADEM • EXTEENG • ADAM KRAFT</text>
  <text x="76" y="790" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">BOTAZ • PRAWNS • ZZ_PLANT</text>

  <text x="76" y="905" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">Fundraiser for Rebuilding Alliance + Oxygen for India</text>
  <text x="76" y="980" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="52">Saturday, July 10 — 1PM PST / 4PM EST</text>
  <text x="76" y="1090" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-size="72">twitch.tv/breadfm</text>
  <text x="76" y="1160" fill="#E8FDFF" font-family="Arial, Helvetica, sans-serif" font-size="34">Archival confidence: strong (screenshot-backed)</text>
</svg>
