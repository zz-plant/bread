<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">BREAD Pilot, F8, February 13 2015</title>
  <desc id="desc">Bold black-and-white archival card for BREAD pilot event at F8 with lineup and venue details.</desc>
  <rect width="1080" height="1350" fill="#0A0A0A"/>
  <rect x="58" y="58" width="964" height="1234" fill="none" stroke="#F7F7F7" stroke-width="3"/>
  <text x="90" y="190" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-size="48" letter-spacing="4">BREAD ARCHIVE CARD</text>
  <text x="90" y="330" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-size="190" letter-spacing="8">PILOT</text>
  <text x="92" y="408" fill="#B5B5B5" font-family="Arial, Helvetica, sans-serif" font-size="42" letter-spacing="4">NO. 00 / FEB 13, 2015</text>

  <line x1="92" y1="470" x2="988" y2="470" stroke="#808080" stroke-width="2"/>

  <text x="92" y="560" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-size="68">HELIX</text>
  <text x="92" y="642" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="48">with BOTAZ • CAGE A • PRAWNS</text>

  <text x="92" y="790" fill="#F0F0F0" font-family="Arial, Helvetica, sans-serif" font-size="52">F8 / 1192 FOLSOM ST / SAN FRANCISCO</text>
  <text x="92" y="860" fill="#F0F0F0" font-family="Arial, Helvetica, sans-serif" font-size="52">10PM–3AM • 21+</text>

  <rect x="92" y="950" width="896" height="190" fill="none" stroke="#6E6E6E" stroke-width="2"/>
  <text x="118" y="1020" fill="#D8D8D8" font-family="Arial, Helvetica, sans-serif" font-size="42">FOUNDATIONAL EVENT IN BREAD'S SF TIMELINE.</text>
  <text x="118" y="1085" fill="#D8D8D8" font-family="Arial, Helvetica, sans-serif" font-size="42">EARLY MISSION: WEIRDER, HARDER CLUB SOUNDS.</text>
